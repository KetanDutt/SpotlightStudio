# Tooling configuration only – Spotlight Studio is an application, not a package.

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["images", "data", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",   # long lines are tolerated in docstrings / SQL; the formatter-free style is deliberate
    "UP017",  # keep `timezone.utc` (datetime.UTC needs Python 3.11)
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom: `def route(x: int = Query(...))`
extend-immutable-calls = ["fastapi.Query", "fastapi.Path"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:DeprecationWarning",
]
