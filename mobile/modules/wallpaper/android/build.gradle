plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.spotlightwallpaper'
version = '0.3.0'

// The SDK 57 module plugin configures Kotlin, ExpoModulesCore dependencies and
// compile/min/target SDK values from the generated app's root project. The old
// ExpoModulesCorePlugin.gradle script no longer exists in this SDK.
android {
  namespace "expo.modules.spotlightwallpaper"
  defaultConfig {
    versionCode 3
    versionName "0.3.0"
  }
}
