name: Native build gates

on:
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-native.yml'
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-native.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

# Compilation smoke tests, NOT signed store submissions or physical-device certification.
jobs:
  android:
    name: Android release compilation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APP_VARIANT: production
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npm run verify:config
      - run: npx expo prebuild --platform android --clean --no-install
      # One ABI keeps the smoke job affordable. EAS store builds must use the full ABI set.
      - name: Compile release app and local Kotlin module
        run: ./gradlew :app:assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon
        working-directory: mobile/android
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-build-reports
          path: mobile/android/**/build/reports/
          retention-days: 7

  ios:
    name: iOS release simulator compilation
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      APP_VARIANT: production
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run verify:config
      - run: npx expo prebuild --platform ios --clean --no-install
      - run: pod install --project-directory=ios
      - name: Compile app and local Swift module without signing
        run: |
          xcodebuild -workspace ios/SpotlightStudio.xcworkspace \
            -scheme SpotlightStudio -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath /tmp/spotlight-ios-build CODE_SIGNING_ALLOWED=NO build
